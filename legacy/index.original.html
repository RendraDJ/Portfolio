<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  var wrap = document.getElementById('heroWrap');
  var stage = document.getElementById('stage');
  var RATIO = 1920/1080;
  function sizeStage(){
    var vw = wrap.clientWidth, vh = wrap.clientHeight;
    var w;
    if (vw/vh > RATIO){
      w = vw;
      stage.style.width = vw + 'px';
      stage.style.height = (vw/RATIO) + 'px';
    } else {
      w = vh*RATIO;
      stage.style.height = vh + 'px';
      stage.style.width = w + 'px';
    }
    stage.style.setProperty('--scale', w / 1920);
  }
  sizeStage();
  window.addEventListener('resize', sizeStage);
  window.addEventListener('orientationchange', sizeStage);

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var everyoneEl = document.getElementById('everyone');

  // ---- GSAP: per-person hover highlight ----
  var FILTER_OFF = 'grayscale(0%) brightness(1)';
  var FILTER_ON  = 'grayscale(70%) brightness(0.55)';
  var GLOW_OFF   = 'drop-shadow(0 0 0px rgba(255,255,255,0))';
  var GLOW_ON    = 'drop-shadow(0 0 42px rgba(255,255,255,0.6))';

  var hotspots = stage.querySelectorAll('.hotspot');
  hotspots.forEach(function(h){
    var n = h.dataset.person;
    var personEl = document.getElementById('p' + n);
    var labelEl = document.getElementById('label' + n);

    function enter(){
      if (reduceMotion){
        gsap.set(everyoneEl, { filter: FILTER_ON });
        gsap.set(personEl, { opacity: 1, scale: 1.045, filter: GLOW_ON });
        gsap.set(labelEl, { opacity: 1, y: 0 });
        return;
      }
      gsap.to(everyoneEl, { filter: FILTER_ON, duration: 0.5, ease: 'power2.out', overwrite: 'auto' });
      gsap.to(personEl, { opacity: 1, scale: 1.045, filter: GLOW_ON, duration: 0.5, ease: 'power3.out', overwrite: 'auto' });
      gsap.set(labelEl, { opacity: 1, y: 0 });
    }
    function leave(){
      if (reduceMotion){
        gsap.set(everyoneEl, { filter: FILTER_OFF });
        gsap.set(personEl, { opacity: 0, scale: 1, filter: GLOW_OFF });
        gsap.set(labelEl, { opacity: 0, y: 10 });
        return;
      }
      gsap.to(everyoneEl, { filter: FILTER_OFF, duration: 0.5, ease: 'power2.inOut', overwrite: 'auto' });
      gsap.to(personEl, { opacity: 0, scale: 1, filter: GLOW_OFF, duration: 0.4, ease: 'power2.inOut', overwrite: 'auto' });
      gsap.set(labelEl, { opacity: 0, y: 10 });
    }

    h.addEventListener('pointerenter', enter);
    h.addEventListener('pointerleave', leave);
    h.addEventListener('focus', enter);
    h.addEventListener('blur', leave);
    h.addEventListener('click', function(){
      stage.dispatchEvent(new CustomEvent('person:select', { detail: { person: n } }));
    });
    h.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); h.click(); }
    });
  });
})();
</script>
