<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- The Classifier: an inbox sorted by the model into its categories -->
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#1c1d20" stroke-opacity="0.05" stroke-width="2"/></pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.18"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1c1d20"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#ecebe5"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- the inbox -->
  <g filter="url(#sh)" transform="rotate(-3 400 500)">
    <rect x="110" y="150" width="560" height="700" rx="26" fill="#fff"/>
    <circle cx="146" cy="186" r="8" fill="#b9b7b0"/><circle cx="172" cy="186" r="8" fill="#cbc9c2"/><circle cx="198" cy="186" r="8" fill="#dddbd5"/>
    <text x="150" y="252" font-size="34" font-weight="800" fill="#1c1d20" letter-spacing="-1">Inbox</text>
    <text x="630" y="252" font-size="20" fill="#1c1d20" fill-opacity="0.5" text-anchor="end" font-family="Menlo, Consolas, monospace">21 today</text>
    <g font-size="17" font-weight="700">
      <g transform="translate(150 290)">
        <rect width="480" height="84" rx="14" fill="#f4f3ef"/><circle cx="42" cy="42" r="20" fill="#d5d3cc"/>
        <rect x="78" y="24" width="210" height="13" rx="6" fill="#1c1d20"/><rect x="78" y="48" width="150" height="10" rx="5" fill="#1c1d20" fill-opacity="0.25"/>
        <rect x="372" y="27" width="88" height="32" rx="16" fill="#5c5d61"/><text x="416" y="49" text-anchor="middle" fill="#fff">RFQ</text>
      </g>
      <g transform="translate(150 388)">
        <rect width="480" height="84" rx="14" fill="#f4f3ef"/><circle cx="42" cy="42" r="20" fill="#d5d3cc"/>
        <rect x="78" y="24" width="180" height="13" rx="6" fill="#1c1d20"/><rect x="78" y="48" width="190" height="10" rx="5" fill="#1c1d20" fill-opacity="0.25"/>
        <rect x="372" y="27" width="88" height="32" rx="16" fill="#1c1d20"/><text x="416" y="49" text-anchor="middle" fill="#fff">TECH</text>
      </g>
      <g transform="translate(150 486)">
        <rect width="480" height="84" rx="14" fill="#f4f3ef"/><circle cx="42" cy="42" r="20" fill="#d5d3cc"/>
        <rect x="78" y="24" width="230" height="13" rx="6" fill="#1c1d20"/><rect x="78" y="48" width="120" height="10" rx="5" fill="#1c1d20" fill-opacity="0.25"/>
        <rect x="372" y="27" width="88" height="32" rx="16" fill="none" stroke="#1c1d20" stroke-width="2.5"/><text x="416" y="49" text-anchor="middle" fill="#1c1d20">SPAM</text>
      </g>
      <g transform="translate(150 584)">
        <rect width="480" height="84" rx="14" fill="#f4f3ef"/><circle cx="42" cy="42" r="20" fill="#d5d3cc"/>
        <rect x="78" y="24" width="160" height="13" rx="6" fill="#1c1d20"/><rect x="78" y="48" width="200" height="10" rx="5" fill="#1c1d20" fill-opacity="0.25"/>
        <rect x="358" y="27" width="102" height="32" rx="16" fill="#d5d3cc"/><text x="409" y="49" text-anchor="middle" fill="#1c1d20">COLLAB</text>
      </g>
      <g transform="translate(150 682)">
        <rect width="480" height="84" rx="14" fill="#f4f3ef"/><circle cx="42" cy="42" r="20" fill="#d5d3cc"/>
        <rect x="78" y="24" width="200" height="13" rx="6" fill="#1c1d20"/><rect x="78" y="48" width="140" height="10" rx="5" fill="#1c1d20" fill-opacity="0.25"/>
        <rect x="372" y="27" width="88" height="32" rx="16" fill="#5c5d61"/><text x="416" y="49" text-anchor="middle" fill="#fff">RFQ</text>
      </g>
    </g>
  </g>

  <!-- e-mails flowing into the model -->
  <g fill="none" stroke="#1c1d20" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round">
    <path d="M690 330C780 340 800 420 850 460"/>
    <path d="M690 520C760 520 790 500 830 500"/>
    <path d="M690 700C780 690 800 600 850 545"/>
  </g>

  <!-- the model: text to embedding to class -->
  <g filter="url(#sh)">
    <circle cx="960" cy="500" r="128" fill="#1c1d20"/>
  </g>
  <circle cx="960" cy="500" r="150" fill="none" stroke="#5c5d61" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round"/>
  <text x="960" y="482" text-anchor="middle" font-size="34" font-weight="800" fill="#fff" letter-spacing="-1">MiniLM</text>
  <text x="960" y="514" text-anchor="middle" font-size="17" fill="#c9c8c2" font-family="Menlo, Consolas, monospace">embeddings</text>
  <g fill="#c9c8c2">
    <rect x="896" y="540" width="10" height="26" rx="3"/><rect x="912" y="532" width="10" height="34" rx="3" fill-opacity="0.6"/>
    <rect x="928" y="548" width="10" height="18" rx="3"/><rect x="944" y="528" width="10" height="38" rx="3" fill-opacity="0.6"/>
    <rect x="960" y="544" width="10" height="22" rx="3"/><rect x="976" y="536" width="10" height="30" rx="3" fill-opacity="0.6"/>
    <rect x="992" y="550" width="10" height="16" rx="3"/><rect x="1008" y="540" width="10" height="26" rx="3" fill-opacity="0.6"/>
  </g>
  <text x="940" y="716" text-anchor="middle" font-size="14" fill="#1c1d20" fill-opacity="0.55" font-family="Menlo, Consolas, monospace" letter-spacing="1">CLEAN · TRANSLATE · EMBED · CLASSIFY</text>

  <!-- sorted into the trays -->
  <g fill="none" stroke="#1c1d20" stroke-width="3" marker-end="url(#ar)">
    <path d="M1090 430C1140 330 1170 260 1205 250"/>
    <path d="M1100 480C1150 450 1170 430 1205 430"/>
    <path d="M1100 540C1150 580 1170 610 1205 610"/>
    <path d="M1090 590C1140 690 1170 780 1205 790"/>
  </g>
  <g font-weight="800" filter="url(#sh)">
    <g transform="translate(1215 180)">
      <path d="M0 22a14 14 0 0 1 14-14h90l16 18h146a14 14 0 0 1 14 14v100a14 14 0 0 1-14 14H14a14 14 0 0 1-14-14z" fill="#5c5d61"/>
      <text x="26" y="92" font-size="34" fill="#fff" letter-spacing="-1">RFQ</text>
      <text x="254" y="92" font-size="30" fill="#fff" text-anchor="end">128</text>
    </g>
    <g transform="translate(1215 360)">
      <path d="M0 22a14 14 0 0 1 14-14h90l16 18h146a14 14 0 0 1 14 14v100a14 14 0 0 1-14 14H14a14 14 0 0 1-14-14z" fill="#1c1d20"/>
      <text x="26" y="92" font-size="30" fill="#fff" letter-spacing="-1">Tech inquiries</text>
    </g>
    <g transform="translate(1215 540)">
      <path d="M0 22a14 14 0 0 1 14-14h90l16 18h146a14 14 0 0 1 14 14v100a14 14 0 0 1-14 14H14a14 14 0 0 1-14-14z" fill="#d5d3cc"/>
      <text x="26" y="92" font-size="30" fill="#1c1d20" letter-spacing="-1">Collab</text>
    </g>
    <g transform="translate(1215 720)">
      <path d="M0 22a14 14 0 0 1 14-14h90l16 18h146a14 14 0 0 1 14 14v100a14 14 0 0 1-14 14H14a14 14 0 0 1-14-14z" fill="#fff" stroke="#1c1d20" stroke-width="3"/>
      <text x="26" y="92" font-size="30" fill="#1c1d20" letter-spacing="-1">Spam</text>
    </g>
  </g>
</svg>
